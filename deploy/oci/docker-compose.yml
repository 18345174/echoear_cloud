# OCI stack template: /opt/stack/echoear_cloud
# Public domain: xu-hapi.flyooo.uk (Traefik + Cloudflare)
services:
  postgres:
    image: postgres:17-alpine
    container_name: echoear-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-echoear}
      POSTGRES_USER: ${POSTGRES_USER:-echoear}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-echoear} -d ${POSTGRES_DB:-echoear}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - echoear

  api:
    image: ${ECHOEAR_IMAGE:-ghcr.io/18345174/echoear_cloud:latest}
    container_name: echoear-api
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-echoear}
      POSTGRES_USER: ${POSTGRES_USER:-echoear}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_SSLMODE: disable
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD in .env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      ACCESS_TICKET_SIGNING_KEY: ${ACCESS_TICKET_SIGNING_KEY:-}
      HTTP_PORT: 8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      GIN_MODE: ${GIN_MODE:-release}
    ports:
      - "127.0.0.1:18080:8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - echoear
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.echoear.rule=Host(`xu-hapi.flyooo.uk`)
      - traefik.http.routers.echoear.entrypoints=websecure
      - traefik.http.routers.echoear.tls=true
      - traefik.http.routers.echoear.tls.certresolver=letsencrypt
      - traefik.http.routers.echoear.service=echoear
      - traefik.http.routers.echoear-http.rule=Host(`xu-hapi.flyooo.uk`)
      - traefik.http.routers.echoear-http.entrypoints=web
      - traefik.http.routers.echoear-http.middlewares=redirect-to-https@file
      - traefik.http.routers.echoear-http.service=echoear
      - traefik.http.services.echoear.loadbalancer.server.port=8080
      - traefik.http.services.echoear.loadbalancer.passHostHeader=true

  relay:
    image: ${ECHOEAR_RELAY_IMAGE:-ghcr.io/tiann/tunwg:eb51a7f}
    container_name: echoear-relay
    profiles: ["relay"]
    pull_policy: always
    restart: unless-stopped
    environment:
      TUNWG_RUN_SERVER: "true"
      TUNWG_PATH: /data
      TUNWG_PORT: "443"
      # deploy.sh rejects these placeholders before enabling the relay profile.
      TUNWG_IP: ${ECHOEAR_RELAY_PUBLIC_IP:-127.0.0.1}
      TUNWG_API: ${ECHOEAR_RELAY_DOMAIN:-relay.invalid}
      TUNWG_AUTH_SECRET: ${ECHOEAR_RELAY_AUTH_SECRET:-disabled}
      TUNWG_QUOTA_BYTES: ${ECHOEAR_RELAY_QUOTA_BYTES:-0}
      TUNWG_SSL_EMAIL: ${ECHOEAR_RELAY_SSL_EMAIL:-}
    volumes:
      - ./relay_data:/data
    ports:
      # WireGuard uses UDP directly. TCP 80/443 remain owned by Traefik.
      - "443:443/udp"
    expose:
      - "80"
      - "443"
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # tunwg terminates TLS so Hub traffic stays encrypted through the relay.
      - traefik.tcp.routers.echoear-relay.rule=HostSNI(`${ECHOEAR_RELAY_DOMAIN:-relay.invalid}`) || HostSNIRegexp(`^.+\\.${ECHOEAR_RELAY_DOMAIN:-relay.invalid}`)
      - traefik.tcp.routers.echoear-relay.entrypoints=websecure
      - traefik.tcp.routers.echoear-relay.tls.passthrough=true
      - traefik.tcp.routers.echoear-relay.service=echoear-relay
      - traefik.tcp.services.echoear-relay.loadbalancer.server.port=443
      # ACME HTTP-01 requests for generated Hub subdomains enter on port 80.
      - traefik.http.routers.echoear-relay-http.rule=Host(`${ECHOEAR_RELAY_DOMAIN:-relay.invalid}`) || HostRegexp(`^.+\\.${ECHOEAR_RELAY_DOMAIN:-relay.invalid}`)
      - traefik.http.routers.echoear-relay-http.entrypoints=web
      - traefik.http.routers.echoear-relay-http.service=echoear-relay-http
      - traefik.http.services.echoear-relay-http.loadbalancer.server.port=80

networks:
  echoear:
    driver: bridge
  proxy:
    external: true
