name: Publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment manifests
        run: |
          set -euo pipefail
          bash -n deploy/oci/deploy.sh
          bash -n deploy/oci/validate-relay.sh
          bash scripts/test-deploy-compat.sh
          docker compose \
            --env-file deploy/oci/.env.example \
            -f deploy/oci/docker-compose.yml \
            config --quiet
          docker compose \
            --env-file deploy/oci/.env.example \
            -f deploy/oci/docker-compose.yml \
            --profile relay \
            config --quiet

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=sha,format=long
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Summary
        run: |
          {
            echo "## Docker image published"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Registry | \`${{ env.REGISTRY }}\` |"
            echo "| Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |"
            echo "| Platforms | \`linux/amd64\`, \`linux/arm64\` |"
            echo "| Tags | \`${{ steps.meta.outputs.tags }}\` |"
            echo ""
            echo "Pull latest:"
            echo "\`\`\`bash"
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger OCI deploy workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Dispatching deploy-oci.yml on ref ${GITHUB_REF_NAME}"
          gh workflow run deploy-oci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME"
          sleep 3
          gh run list --repo "$GITHUB_REPOSITORY" --workflow=deploy-oci.yml --limit 3
